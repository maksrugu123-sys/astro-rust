[package]
name = "astro-rust"
version = "0.1.0"
edition = "2024"
description = "An original Rust-based planetary exploration game, targeting Android first."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "astro_rust"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "astro-rust"
path = "src/main.rs"

[dependencies]
bevy = "0.20"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
